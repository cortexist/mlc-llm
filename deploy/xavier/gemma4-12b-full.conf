# Gemma4 12B MTP with all Xavier options: tensor-core attention, the 4-bit
# assistant and three proposals per round. Needs the 12B libraries of
# scripts/build_xavier_contexts.sh, and dual-model.conf to load the model.
[Service]
Environment=MLC_GEMMA4_MTP_PREFILL=paged
Environment=MLC_GEMMA4_MTP_ASSISTANT=q4f16_1
Environment=MLC_GEMMA4_MTP_DRAFTS=3
