# A Qwen3.5-family chat model with a small draft of the same family as the second
# chat model (scripts/build_xavier_qwen35.sh, scripts/qwen35_service.py). Beside
# Nemotron and EmbeddingGemma 2, a 32 GB Xavier holds a 27B target with a 2B draft
# only without the 12B and d1. Its name sorts after dual-model.conf and
# specialists.conf, whose settings for those two it replaces.
[Unit]
Description=Resident Nemotron, Qwen3.8 27B and EmbeddingGemma 2 on Xavier

[Service]
Environment=MLC_QWEN35=1
Environment=MLC_GEMMA4_MTP=0
Environment=MLC_D1=0
# Tensor-core attention for both models (the native module of the build script).
Environment=MLC_QWEN35_PREFILL=paged
