# A Qwen3.5-family chat model as the second chat model, its tokens proposed by the
# checkpoint's own multi-token prediction head or by a small draft of the same family
# (scripts/build_xavier_qwen35.sh, scripts/qwen35_service.py). Beside Nemotron and
# EmbeddingGemma 2, a 32 GB Xavier holds a 27B target only without the 12B and d1.
# Its name sorts after dual-model.conf and specialists.conf, whose settings for
# those two it replaces.
[Unit]
Description=Resident Nemotron, Qwen3.8 27B and EmbeddingGemma 2 on Xavier

[Service]
Environment=MLC_QWEN35=1
Environment=MLC_GEMMA4_MTP=0
Environment=MLC_D1=0
# The target was converted and built with its head (MLC_QWEN35_MTP=1 in both steps).
# Without this line a draft proposes: dist/qwen35-draft and its library.
Environment=MLC_QWEN35_MTP=1
# Tensor-core attention (the native module of the build script).
Environment=MLC_QWEN35_PREFILL=paged
