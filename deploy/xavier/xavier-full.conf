# Nemotron MTP, all Xavier attention and prefill options. Needs a target built
# with mtp_prefill_kv, the native 16K assistant and the paged attention module
# (scripts/build_xavier_e4b_mtp.sh). Its name sorts after prefill-width.conf,
# whose attention variant it replaces.
[Service]
Environment=MLC_NEMOTRON_PREFILL=paged
Environment=MLC_NEMOTRON_MTP_KV_PREFILL=1
Environment=MLC_NEMOTRON_MTP_ASSISTANT=gemma4-e4b-mtp-assistant-native-16k-sm72.so
