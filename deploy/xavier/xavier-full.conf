# Nemotron MTP, all Xavier options: tensor-core attention, K/V-only prefill, one
# assistant, grouped 4-bit projections and three proposals. Needs the grouped
# target, the native 16K assistant and the paged attention module
# (scripts/build_xavier_e4b_mtp.sh). Its name sorts after prefill-width.conf,
# whose attention variant it replaces.
[Service]
Environment=MLC_NEMOTRON_PREFILL=paged
Environment=MLC_NEMOTRON_MTP_KV_PREFILL=1
Environment=MLC_NEMOTRON_MTP_ASSISTANT=gemma4-e4b-mtp-assistant-native-16k-sm72.so
Environment=MLC_NEMOTRON_MTP_TARGET=nemotron-e4b-mtp-target-grouped-16k-sm72.so
Environment=MLC_NEMOTRON_MTP_DRAFTS=3
