server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name cerebellum.lan;
    ssl_certificate /etc/nginx/tls/cerebellum.crt;
    ssl_certificate_key /etc/nginx/tls/cerebellum.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NemotronTLS:1m;
    server_tokens off;
    client_max_body_size 4m;

    # LAN, loopback and the existing tailnet. Do not expose through public IPv6.
    allow 192.168.12.0/24;
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    allow ::1;
    allow fd7a:115c:a1e0::/48;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
